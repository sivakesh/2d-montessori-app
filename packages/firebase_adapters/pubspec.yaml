# Thin adapters over Firebase SDKs (Auth, Firestore, Storage, Functions,
# App Check) plus environment/emulator bootstrap. Per PRD §11.1, only this
# package and functions/ may depend on Firebase SDKs directly — feature
# `data/` layers depend on this package's interfaces, never on
# firebase_core/cloud_firestore etc. directly.
name: firebase_adapters
description: Firebase SDK adapters and environment/emulator bootstrap for 2D Montessori.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  core_contracts:
    path: ../core_contracts
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.6
  cloud_functions: ^5.1.6
  firebase_app_check: ^0.3.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
