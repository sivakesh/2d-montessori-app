# Shared lint baseline for every workspace member. Each app/package includes
# this file via a relative path (../../analysis_options.yaml) so lint rules
# stay centrally controlled — see NFR-12 (Maintainability) in the Phase 1 SRS.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
    - "build/**"

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - avoid_type_to_string
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_final_locals
    - prefer_relative_imports
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
    - unnecessary_await_in_return
    - use_key_in_widget_constructors
