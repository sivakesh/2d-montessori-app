# Admin/CMS composition root (PRD §11.1 apps/admin_web: admin routing,
# shell, authentication gates).
#
# feature_identity was wired in at the Phase 1 Foundation milestone (auth,
# custom claims, role matrix, user management). feature_pages and
# feature_publishing were wired in at Phase 1 CMS Core / feature_pages
# (Pages editor + workflow actions). The remaining feature_* packages
# (feature_media, feature_audit, feature_settings, feature_enquiries,
# plus every other content-collection feature) get added here as later
# Phase 2 milestones implement each admin screen.
name: admin_web
description: "2D Montessori admin/CMS portal"
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  core_contracts:
    path: ../../packages/core_contracts
  design_system:
    path: ../../packages/design_system
  firebase_adapters:
    path: ../../packages/firebase_adapters
  feature_identity:
    path: ../../packages/feature_identity
  feature_publishing:
    path: ../../packages/feature_publishing
  feature_pages:
    path: ../../packages/feature_pages

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
