name: 🚀 Deploy to Firebase (DEV/UAT)

# PROD-01: this workflow deploys ONLY to the DEV/UAT Firebase project
# (montessori-app-95988, .firebaserc alias "dev"). It must never be changed
# to deploy to production as a side effect of APP_ENV=prod -- APP_ENV
# controls application behaviour only, not the Firebase backend.
# Production deploys live in a separate, manually-triggered workflow:
# .github/workflows/deploy-prod.yml

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web (APP_ENV=prod, DEPLOY_TARGET=dev)
        run: flutter build web --release --dart-define=APP_ENV=prod --dart-define=DEPLOY_TARGET=dev

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Setup Firebase Auth
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > firebase-service-account.json

      - name: Deploy to Firebase (dev alias -> montessori-app-95988)
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS=firebase-service-account.json
          firebase deploy --project dev --only hosting 2>&1 | tee firebase-deploy.log

          EXIT_CODE=${PIPESTATUS[0]}

          if [ $EXIT_CODE -ne 0 ]; then
            if grep -q "current active version" firebase-deploy.log; then
              echo "Firebase Hosting version is already active. Treating as success."
              exit 0
            fi

            exit $EXIT_CODE
          fi
