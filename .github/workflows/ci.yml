name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets CI be triggered manually on any branch (e.g. `gh workflow run
  # ci.yml --ref <branch>`) without changing the automatic push/PR
  # triggers above. Used to run this workflow on feature/verification
  # branches that don't share history with `main` and so can't go
  # through a PR.
  workflow_dispatch:

jobs:
  flutter:
    name: Flutter workspace (format, analyze, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      # Pub workspaces: a single `pub get` at the repo root resolves every
      # app and package in pubspec.yaml's `workspace:` list.
      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test (apps + packages)
        run: |
          set -e
          for dir in apps/* packages/*; do
            if [ -f "$dir/pubspec.yaml" ]; then
              echo "::group::flutter test $dir"
              (cd "$dir" && flutter test)
              echo "::endgroup::"
            fi
          done

  functions:
    name: Cloud Functions (lint, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify deploy package (entry point survives Firebase's deploy-ignore rules)
        run: npm run verify:deploy-package

      - name: Test
        run: npm test

  security-rules:
    name: Firestore/Storage rules + Cloud Functions callables (emulator-backed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # firebase-tools checks the Java version at startup for any
      # emulators:start/emulators:exec invocation (even Auth/Storage-only
      # runs), and requires 21+. See README.md "Prerequisites". This
      # environment is what actually exercises the suites authored in
      # functions/test/emulator and firebase/test — they were only
      # statically type-checked, not run, in the environment that wrote
      # them (see docs/architecture/decisions.md "Phase 1 Foundation —
      # test execution status").
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Cloud Functions callables against Auth + Firestore emulators
        working-directory: functions
        run: npm run test:emulator

      - name: Install security-rules test dependencies
        working-directory: firebase/test
        run: npm ci

      - name: Firestore/Storage rules + disabled-account sign-in, against emulators
        working-directory: firebase/test
        run: npm run test:against-emulators
