name: CI (montessori-cms-monorepo verification only)

# Manual-dispatch only, deliberately. This workflow belongs to the
# unrelated montessori_cms_app monorepo (Flutter workspace + Firebase),
# pushed here temporarily on the `montessori-cms-monorepo` branch solely
# so its CI could run at all (GitHub requires a workflow file to exist on
# the default branch before it can be dispatched on any other branch).
# It must NOT auto-trigger on pushes/PRs to this repo's real `main` —
# its jobs (flutter pub get, functions/ npm ci, firebase/test/) assume
# that other project's file layout and would simply fail here. Safe to
# delete this file once verification is done; see the montessori-cms-app
# project owner for context.
on:
  workflow_dispatch:

jobs:
  flutter:
    name: Flutter workspace (format, analyze, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      # Pub workspaces: a single `pub get` at the repo root resolves every
      # app and package in pubspec.yaml's `workspace:` list.
      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test (apps + packages)
        run: |
          set -e
          for dir in apps/* packages/*; do
            if [ -f "$dir/pubspec.yaml" ]; then
              echo "::group::flutter test $dir"
              (cd "$dir" && flutter test)
              echo "::endgroup::"
            fi
          done

  functions:
    name: Cloud Functions (lint, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  security-rules:
    name: Firestore/Storage rules + Cloud Functions callables (emulator-backed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # firebase-tools checks the Java version at startup for any
      # emulators:start/emulators:exec invocation (even Auth/Storage-only
      # runs), and requires 21+. See README.md "Prerequisites". This
      # environment is what actually exercises the suites authored in
      # functions/test/emulator and firebase/test — they were only
      # statically type-checked, not run, in the environment that wrote
      # them (see docs/architecture/decisions.md "Phase 1 Foundation —
      # test execution status").
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Cloud Functions callables against Auth + Firestore emulators
        working-directory: functions
        run: npm run test:emulator

      - name: Install security-rules test dependencies
        working-directory: firebase/test
        run: npm ci

      - name: Firestore/Storage rules + disabled-account sign-in, against emulators
        working-directory: firebase/test
        run: npm run test:against-emulators
